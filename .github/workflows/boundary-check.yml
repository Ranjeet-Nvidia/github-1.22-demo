name: Blossom runner boundary check

on:
  workflow_dispatch:

permissions: {}

jobs:
  reachability:
    runs-on: blossom
    timeout-minutes: 5
    steps:
      - name: Check system shell and file access
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          echo "BOUNDARY-CHECK"
          whoami
          id
          pwd

          echo "Available commands:"
          compgen -c | sort -u

          echo "Workspace:"
          ls -la -- "$GITHUB_WORKSPACE"

          echo "OS information:"
          cat /etc/os-release
